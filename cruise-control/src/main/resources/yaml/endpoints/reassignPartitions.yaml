ReassignPartitionsEndpoint:
  post:
    operationId: reassignPartitions
    summary: Reassign partition replicas, move leadership or move replicas between log directories as requested.
    description: |
      Executes a manual partition reassignment through the executor of Cruise Control -- e.g. to promote another replica to
      leader, to move a replica to another log directory of its broker, or to move replicas between brokers.

      The reassignment is given in the request body (header `Content-Type: application/json`) in the format of
      kafka-reassign-partitions.sh, plus two shorthands -- each partition entry uses exactly one form:
      ```
      {"version": 1,
       "partitions": [
         {"topic": "orders", "partition": 3, "leader": 102},
         {"topic": "orders", "partition": 7, "log_dirs": {"101": "/data/d2"}},
         {"topic": "events", "partition": 0, "replicas": [104, 105, 106], "log_dirs": ["any", "any", "/data/d3"]}]}
      ```
      * `leader`: keep the replica set and make the given replica the (preferred) leader.
      * `log_dirs` object: move the replicas on the given brokers to the given log directories of these brokers.
      * `replicas` (and optional `log_dirs` array): the new ordered replica list; the first replica becomes the leader. A log
        directory of `any` keeps the log directory of an existing replica, or lets the broker pick one for an added replica.

      The response shows the per-partition plan and its impact on the cluster load and goals. Unless `skip_hard_goal_check`
      is set, a reassignment that would violate a hard goal -- or whose impact on hard goals cannot be verified -- is not
      executed. Moving existing replicas between log directories cannot be combined with replica set or order changes in the
      same request. The body is not declared as a request body, because polling a user task (via the `User-Task-ID` header)
      does not require it.
    parameters:
      - name: dryrun
        in: query
        description: Whether to dry-run the request or not.
        schema:
          type: boolean
          default: true
      - name: reason
        in: query
        description: Reason for request.
        schema:
          type: string
      - name: stop_ongoing_execution
        in: query
        description: Whether to stop the ongoing execution (if any) and start executing the given request.
        schema:
          type: boolean
          default: false
      - name: review_id
        in: query
        description: Review id for 2-step verification.
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: goals
        in: query
        description: List of goals to analyze the impact of the reassignment against. The default goals are used if this parameter is
                     not specified -- or the intra-broker goals if the request moves replicas between log directories.
        schema:
          type: array
          items:
            type: string
          example: ["RackAwareGoal", "ReplicaCapacityGoal", "NetworkOutboundCapacityGoal"]
      - name: skip_hard_goal_check
        in: query
        description: Whether to execute the reassignment even if it violates hard goals, or its impact on hard goals cannot be verified
                     -- e.g. the load monitor is not ready. Also allows specifying goals without the hard goals.
        schema:
          type: boolean
          default: false
      - name: allow_capacity_estimation
        in: query
        description: Whether to allow capacity estimation when cruise-control is unable to obtain all per-broker capacity information.
        schema:
          type: boolean
          default: true
      - name: concurrent_partition_movements_per_broker
        in: query
        description: The upper bound of ongoing replica movements (including replica reorders for leadership movements) going
                     into/out of each broker.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: max_partition_movements_in_cluster
        in: query
        description: Change upper bound of ongoing inter broker partition movements in cluster.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: concurrent_intra_broker_partition_movements
        in: query
        description: The upper bound of ongoing replica movements between disks within each broker.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: concurrent_leader_movements
        in: query
        description: The upper bound of cluster ongoing leadership movements.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: broker_concurrent_leader_movements
        in: query
        description: The upper bound of per broker ongoing leadership movements.
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: execution_progress_check_interval_ms
        in: query
        description: Execution progress check interval in milliseconds.
        schema:
          type: integer
          format: int64
          minimum: 5000
      - name: replica_movement_strategies
        in: query
        description: Replica movement strategies to use.
        schema:
          type: array
          items:
            type: string
          example: ["PrioritizeLargeReplicaMovementStrategy", "PostponeUrpReplicaMovementStrategy"]
      - name: replication_throttle
        in: query
        description: Upper bound on the bandwidth in bytes per second used to move replicas between brokers.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: json
        in: query
        description: Whether to return in JSON format or not.
        schema:
          type: boolean
          default: false
      - name: get_response_schema
        in: query
        description: Whether to return JSON schema in response header or not.
        schema:
          type: boolean
          default: false
      - name: doAs
        in: query
        description: The user specified by a trusted proxy in that authentication model.
        schema:
          type: string
    responses:
      '200':
        description: Successful partition reassignment response.
        content:
          application/json:
            schema:
              $ref: '../responses/reassignPartitionsResult.yaml#/ReassignPartitionsResult'
          text/plain:
            schema:
              type: string
      '202':
        description: Partition reassignment in progress.
        content:
          application/json:
            schema:
              $ref: '../responses/progressResult.yaml#/ProgressResult'
          text/plain:
            schema:
              type: string
      # Response for all errors
      default:
        description: Error response.
        content:
          application/json:
            schema:
              $ref: '../responses/errorResponse.yaml#/ErrorResponse'
          text/plain:
            schema:
              type: string
